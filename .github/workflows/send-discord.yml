name: Send News to Discord

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'summaries/**.md'

jobs:
  send-to-discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Send to Discord
        env:
          WEBHOOK_AI:    ${{ secrets.DISCORD_WEBHOOK_AI }}
          WEBHOOK_SPORT: ${{ secrets.DISCORD_WEBHOOK_SPORT }}
          WEBHOOK_BIZ:   ${{ secrets.DISCORD_WEBHOOK_BIZ }}
        run: python3 scripts/send_discord.py