name: Send News to Discord

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'summaries/**.md'

jobs:
  send-to-discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/send_discord.py