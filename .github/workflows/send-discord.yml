name: Send Daily News to Discord

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "summaries/**.md"

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send news to Discord
        env:
          DISCORD_WEBHOOK_AI:      ${{ secrets.DISCORD_WEBHOOK_AI }}
          DISCORD_WEBHOOK_SPORT:   ${{ secrets.DISCORD_WEBHOOK_SPORT }}
          DISCORD_WEBHOOK_BIZ:     ${{ secrets.DISCORD_WEBHOOK_BIZ }}
          DISCORD_WEBHOOK_CULTURE:   ${{ secrets.DISCORD_WEBHOOK_CULTURE }}
          DISCORD_WEBHOOK_FIRSTJOB:  ${{ secrets.DISCORD_WEBHOOK_FIRSTJOB }}
          DISCORD_WEBHOOK_POLITICS:  ${{ secrets.DISCORD_WEBHOOK_POLITICS }}
        run: python3 scripts/send_discord.py
